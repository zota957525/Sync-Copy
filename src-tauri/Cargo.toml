[package]
name = "sync-copy"
version = "0.2.0"
description = "LAN clipboard sync between Mac and Windows"
authors = ["you"]
edition = "2021"

[lib]
name = "sync_copy_lib"
# rlib only: desktop (macOS + Windows) 打包只走 bin crate (main.rs) 链 rlib 即可。
# cdylib/staticlib 仅在 mobile (iOS/Android) tauri build 时才需要；
# 项目当前仅支持 macOS + Windows，去掉这两个 crate-type 可避免：
#   1. Windows CI: cargo test 生成的测试 exe 不 link WebView2Loader.dll（cdylib
#      初始化路径拉入 webview2-com-sys -> WebView2Loader.dll，headless runner 上
#      触发 STATUS_ENTRYPOINT_NOT_FOUND 0xc0000139）。
#   2. 每次 cargo build 不必额外生成 .dll / .a 文件，加快构建。
# see decisions/ADR-003-project-architecture-skeleton.md
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# clipboard-real: link arboard (OS clipboard subsystem).
# Enabled by default for dev / release builds.
# Disable for Windows headless CI (`--no-default-features`) to avoid
# STATUS_ENTRYPOINT_NOT_FOUND when the test binary is loaded by the DLL loader
# on a runner without a clipboard/display subsystem.
# see decisions/ADR-003-project-architecture-skeleton.md (第 3.1 节)
default = ["clipboard-real"]
clipboard-real = ["dep:arboard"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
directories = "5"
anyhow = "1"
arboard = { version = "3", optional = true }
axum = "0.8"
# 让 reqwest 用系统默认 TLS 后端（Windows schannel / macOS SecureTransport），避免 rustls 在 Windows 的 crypto provider 坑
reqwest = { version = "0.12", features = ["json"] }
if-addrs = "0.13"
# --- crypto (M4: per-pair X25519 ECDH + HKDF-SHA256 → AES-256-GCM) ---
x25519-dalek = "2"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# zeroize：PeerState.aes_key 类型 Zeroizing<[u8;32]>（ADR-008 MUST-2 / ADR-009 第 3.1 节）
zeroize = { version = "1.8", default-features = false, features = ["zeroize_derive"] }
# PNG 编解码（剪切板图片同步）
image = { version = "0.25", default-features = false, features = ["png"] }
# ADR-010 第 5 节实施提示 #2：tokio-util 提供 CancellationToken（health worker / lifecycle 取消机制）
tokio-util = { version = "0.7", features = ["rt"] }
# ADR-010 实施提示 #2：tracing-appender 提供 rolling file appender + non_blocking guard
tracing-appender = "0.2"
# ADR-010 实施提示 #2：thiserror 用于 StartupError enum（ADR-003 第 3.6 节已用）
thiserror = "1"
