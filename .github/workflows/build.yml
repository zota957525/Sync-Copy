name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: Rust unit + integration tests + clippy
  # 先跑 cargo test + clippy，保证"代码健康度门禁"（specs/cross-platform-build.md 第 5.4 节）
  # 两个 OS 并行运行，任一失败即阻断后续 tauri build job（needs: gate）
  # ---------------------------------------------------------------------------
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            extra_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows-x64
            extra_targets: ''

    runs-on: ${{ matrix.os }}
    name: Gate ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: './src-tauri -> target'
          key: gate-${{ matrix.name }}

      # --- WebView2 Runtime（Windows only）---
      # 根因：wry → webview2-com-sys 在链接时注入 WebView2Loader.dll；
      # cargo test harness exe 启动时需要 WebView2 runtime，
      # GitHub headless Windows runner 未预装 → STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139)。
      # build job 的 windows-latest runner 已预装 WebView2，无需重复安装。
      - name: Install WebView2 Runtime (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/partners/120/MicrosoftEdgeWebView2RuntimeInstallerX64.exe" -OutFile "$env:TEMP\WebView2Installer.exe"
          Start-Process -FilePath "$env:TEMP\WebView2Installer.exe" -Args "/silent /install" -Wait

      # --- Cargo unit tests（--lib：src/ 内 #[cfg(test)] 单测）---
      # Windows headless runner 链接 arboard 会触发 STATUS_ENTRYPOINT_NOT_FOUND；
      # 加 --no-default-features 跳过 clipboard-real feature，使用 headless stub。
      - name: Unit tests (--lib)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo test --no-default-features --manifest-path src-tauri/Cargo.toml --lib
          else
            cargo test --manifest-path src-tauri/Cargo.toml --lib
          fi

      # --- Cargo integration tests（tests/ 目录下的集成测试）---
      - name: Integration tests (--tests)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo test --no-default-features --manifest-path src-tauri/Cargo.toml --tests
          else
            cargo test --manifest-path src-tauri/Cargo.toml --tests
          fi

      # --- Clippy 静态分析（-D warnings 把所有 warning 升为错误）---
      - name: Clippy
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo clippy --no-default-features --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          else
            cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          fi

  # ---------------------------------------------------------------------------
  # Gate 2: Tauri bundle build + artifact upload
  # 依赖 gate job 全绿后才运行。
  # 当前阶段（P5-1 backend MVP）frontend 极简（src/ 含最小 SvelteKit scaffold）；
  # tauri build 需要 npm 依赖 + WebView2（Win）+ Xcode（Mac）等环境。
  # CI runner 的 macos-latest / windows-latest 已预装这些工具，可直接运行。
  # ---------------------------------------------------------------------------
  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            target: universal-apple-darwin
            extra_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows-x64
            target: ''
            extra_targets: ''

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: './src-tauri -> target'
          key: build-${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Build (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run tauri build

      # --- 产物打包：免安装版 + 版本号命名 ---

      - name: Package macOS portable (.app.zip)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          # zip 保留权限 + 符号链接，用 -y
          cd "$APP_DIR"
          zip -r -y "../../../../../../dist/SyncCopy-v${{ steps.version.outputs.version }}-macos-universal-portable.app.zip" "Sync Copy.app"
          cd -
          ls -la dist

      - name: Rename macOS dmg with version
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "dist/SyncCopy-v${{ steps.version.outputs.version }}-macos-universal.dmg"
          fi
          ls -la dist

      - name: Package Windows portable (raw .exe)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          # tauri 2 release binary 路径来自 Cargo.toml package.name = "sync-copy"
          RAW_EXE="src-tauri/target/release/sync-copy.exe"
          if [ ! -f "$RAW_EXE" ]; then
            echo "::error::raw exe not found at $RAW_EXE"
            ls -la src-tauri/target/release
            exit 1
          fi
          cp "$RAW_EXE" "dist/SyncCopy-v${{ steps.version.outputs.version }}-win-x64-portable.exe"
          ls -la dist

      - name: Rename Windows MSI / NSIS with version
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          MSI=$(ls src-tauri/target/release/bundle/msi/*.msi 2>/dev/null | head -1)
          if [ -n "$MSI" ]; then
            cp "$MSI" "dist/SyncCopy-v${{ steps.version.outputs.version }}-win-x64.msi"
          fi
          NSIS=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -n "$NSIS" ]; then
            cp "$NSIS" "dist/SyncCopy-v${{ steps.version.outputs.version }}-win-x64-setup.exe"
          fi
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sync-copy-${{ matrix.name }}-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
