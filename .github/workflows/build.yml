name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: Rust tests / build-verification + clippy
  # 分工策略（2026-05-15 决策 B）：
  #   macOS  — cargo test --lib / --tests（142 单测全平台逻辑，Mac 覆盖即可）
  #   Windows — cargo build 编译验证 + clippy（STATUS_ENTRYPOINT_NOT_FOUND DLL 问题绕开）
  # 两个 OS 并行运行，任一失败即阻断后续 tauri build job（needs: gate）
  # ---------------------------------------------------------------------------
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            extra_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows-x64
            extra_targets: ''

    runs-on: ${{ matrix.os }}
    name: Gate ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: './src-tauri -> target'
          key: gate-${{ matrix.name }}

      # --- WebView2 Runtime（Windows only）---
      # 根因：wry → webview2-com-sys 在链接时注入 WebView2Loader.dll；
      # cargo test harness exe 启动时需要 WebView2 runtime，
      # GitHub headless Windows runner 未预装 → STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139)。
      # build job 的 windows-latest runner 已预装 WebView2，无需重复安装。
      - name: Install WebView2 Runtime (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $url = "https://go.microsoft.com/fwlink/?linkid=2124703"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
          $proc = Start-Process -FilePath "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" -Args "/silent /install" -Wait -PassThru
          if ($proc.ExitCode -notin @(0, 1638)) {
            Write-Error "WebView2 installer exited with code $($proc.ExitCode)"
            exit $proc.ExitCode
          }
          Write-Host "WebView2 install/check passed (exit code $($proc.ExitCode))"

      # --- Cargo unit tests（--lib，macOS only）---
      # Windows 跳过：0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND — cargo test exe 启动时
      # DLL 入口点找不到，--no-default-features 仍无法绕开；Mac 已覆盖 142 单测。
      - name: Unit tests (--lib, macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # --- Cargo integration tests（tests/ 目录，macOS only）---
      - name: Integration tests (--tests, macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --tests

      # --- Windows 编译验证（替代 cargo test）---
      # 验证 Rust 代码在 Windows target 可编译；不运行 exe 避免 DLL 问题。
      - name: Build verification (Windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cargo build --no-default-features --manifest-path src-tauri/Cargo.toml

      # --- Clippy 静态分析（-D warnings 把所有 warning 升为错误）---
      - name: Clippy
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo clippy --no-default-features --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          else
            cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          fi

  # ---------------------------------------------------------------------------
  # Gate 2: Tauri bundle build + artifact upload
  # 依赖 gate job 全绿后才运行。
  # 当前阶段（P5-1 backend MVP）frontend 极简（src/ 含最小 SvelteKit scaffold）；
  # tauri build 需要 npm 依赖 + WebView2（Win）+ Xcode（Mac）等环境。
  # CI runner 的 macos-latest / windows-latest 已预装这些工具，可直接运行。
  # ---------------------------------------------------------------------------
  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            target: universal-apple-darwin
            extra_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows-x64
            target: ''
            extra_targets: ''

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.extra_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: './src-tauri -> target'
          key: build-${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Build (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run tauri build

      # --- Ad-hoc codesign（macOS only）---
      # 背景：qa-tester 2026-05-15 实测 v0.2.0 artifact：codesign -v 显示 "not signed at all"；
      # spctl -a -v 显示 "rejected, source=no usable signature"；
      # 用户实测 macOS 报"Apple 无法验证 Sync Copy 是否包含恶意软件"→ 启动拒绝。
      # _assumptions A29：不做 Apple Developer 代码签名/公证；ad-hoc sign（-）不需要 Developer 账号，
      # 可消除 "not signed" 状态，用户仍需首次手动「允许」，但不再被完全拦截。
      # 必须在打 zip 之前运行，确保 artifact 内含已签名的 .app。
      - name: Ad-hoc codesign (macOS only)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found under src-tauri/target"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          codesign --deep --force --sign - "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | head -10
          echo "Ad-hoc signing applied (Gatekeeper will still warn but allow open after manual approval)"

      # --- 产物打包：免安装版 + 版本号命名 ---

      - name: Package macOS portable (.app.zip)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          # zip 保留权限 + 符号链接，用 -y
          cd "$APP_DIR"
          zip -r -y "../../../../../../dist/SyncCopy-v${{ steps.version.outputs.version }}-macos-universal-portable.app.zip" "Sync Copy.app"
          cd -
          ls -la dist

      - name: Rename macOS dmg with version
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "dist/SyncCopy-v${{ steps.version.outputs.version }}-macos-universal.dmg"
          fi
          ls -la dist

      - name: Package Windows portable (raw .exe)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          # tauri 2 release binary 路径来自 Cargo.toml package.name = "sync-copy"
          RAW_EXE="src-tauri/target/release/sync-copy.exe"
          if [ ! -f "$RAW_EXE" ]; then
            echo "::error::raw exe not found at $RAW_EXE"
            ls -la src-tauri/target/release
            exit 1
          fi
          cp "$RAW_EXE" "dist/SyncCopy-v${{ steps.version.outputs.version }}-win-x64-portable.exe"
          ls -la dist

      - name: Rename Windows MSI / NSIS with version
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          MSI=$(ls src-tauri/target/release/bundle/msi/*.msi 2>/dev/null | head -1)
          if [ -n "$MSI" ]; then
            cp "$MSI" "dist/SyncCopy-v${{ steps.version.outputs.version }}-win-x64.msi"
          fi
          NSIS=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -n "$NSIS" ]; then
            cp "$NSIS" "dist/SyncCopy-v${{ steps.version.outputs.version }}-win-x64-setup.exe"
          fi
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sync-copy-${{ matrix.name }}-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
